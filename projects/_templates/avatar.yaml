# Scaffolded by `videogen new REPLACE_ME_NAME --template avatar --language REPLACE_ME_LANGUAGE`.
# Fill in your script, then: videogen validate projects/REPLACE_ME_NAME.yaml

name: REPLACE_ME_NAME
template: avatar
language: REPLACE_ME_LANGUAGE   # en | fa

# Pick a voice with `videogen voices --language REPLACE_ME_LANGUAGE`.
voice: en-US-AndrewMultilingualNeural
rate: 1.0

avatar: male   # male | female (see assets/avatar/) — or a direct path to your own portrait

platforms: [instagram, linkedin, youtube_shorts]
primary_platform: instagram

music:
  track: assets/music/REPLACE_WITH_YOUR_TRACK.mp3   # optional — remove this block to skip music
  gain_db: -22
  duck: true

captions:
  style: karaoke          # karaoke | block | none
  max_words_per_cue: 4
  position: 0.82

scenes:
  - text: "Write your first line here."
  - text: "And your second line here — each scene just needs text, the avatar photo is the background."
