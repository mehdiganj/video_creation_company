[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-creation-company"
version = "0.1.0"
description = "Code-driven social video generator (faceless narration + text-card videos, Farsi/English)"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
videogen = "videogen.cli:main"

[tool.setuptools.packages.find]
include = ["videogen*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
